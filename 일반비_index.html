<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 할 일</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px 80px;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    /* ── 헤더 ── */
    .header {
      background: white;
      border-radius: 20px;
      padding: 28px 28px 22px;
      box-shadow: 0 4px 24px rgba(59,130,246,0.1);
      margin-bottom: 16px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
    }
    .date-badge {
      font-size: 12px;
      color: #64748b;
      background: #f1f5f9;
      padding: 4px 12px;
      border-radius: 20px;
    }
    .progress-wrap { margin-top: 14px; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 6px;
    }
    .progress-track {
      background: #e2e8f0;
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    /* ── 입력창 ── */
    .input-area {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 24px rgba(59,130,246,0.08);
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
    }
    .todo-input {
      flex: 1;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      color: #1e293b;
      outline: none;
      transition: border-color 0.2s;
    }
    .todo-input:focus { border-color: #3b82f6; }
    .todo-input::placeholder { color: #94a3b8; }

    /* ── 추가 버튼 (기존 버튼 재사용) ── */
    .btn-add {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(59,130,246,0.35);
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn-add:hover {
      background: #1d4ed8;
      box-shadow: 0 6px 20px rgba(29,78,216,0.45);
      transform: translateY(-1px);
    }
    .btn-add:active {
      background: #1e40af;
      transform: translateY(1px);
    }

    /* ── 필터 탭 ── */
    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .filter-btn {
      flex: 1;
      padding: 8px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      background: white;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
    }

    /* ── 리스트 ── */
    .todo-list { display: flex; flex-direction: column; gap: 8px; }

    .todo-item {
      background: white;
      border-radius: 14px;
      padding: 16px 16px 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      transition: transform 0.2s, opacity 0.3s;
      animation: slideIn 0.25s ease;
    }
    .todo-item:hover { transform: translateX(3px); }
    .todo-item.done { opacity: 0.6; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 완료 체크박스 */
    .chk {
      width: 22px; height: 22px;
      border-radius: 7px;
      border: 2px solid #cbd5e1;
      flex-shrink: 0;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      font-size: 12px;
      color: white;
    }
    .chk:hover { border-color: #3b82f6; }
    .todo-item.done .chk {
      background: #10b981;
      border-color: #10b981;
    }

    .todo-text {
      flex: 1;
      font-size: 14px;
      color: #1e293b;
      transition: all 0.2s;
    }
    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: #94a3b8;
    }

    /* 삭제 버튼 */
    .btn-del {
      background: none;
      border: none;
      font-size: 16px;
      color: #cbd5e1;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      line-height: 1;
    }
    .btn-del:hover { color: #ef4444; background: #fef2f2; }

    /* ── 빈 상태 ── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: #94a3b8;
    }
    .empty .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty p { font-size: 14px; }

    /* ── 하단 전체삭제 ── */
    .footer {
      margin-top: 16px;
      text-align: right;
    }
    .btn-clear {
      background: none;
      border: none;
      font-size: 12px;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.2s;
    }
    .btn-clear:hover { color: #ef4444; }
  </style>
</head>
<body>
<div class="app">

  <!-- 헤더 -->
  <div class="header">
    <div class="header-top">
      <h1>📋 오늘의 할 일</h1>
      <span class="date-badge" id="today-date"></span>
    </div>
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="prog-text">0개 완료</span>
        <span id="prog-pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="prog-bar" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- 입력창 + 추가 버튼 -->
  <div class="input-area">
    <input
      class="todo-input"
      id="todo-input"
      type="text"
      placeholder="할 일을 입력하고 엔터 또는 버튼 클릭"
      maxlength="80"
    />
    <button class="btn-add" onclick="addTodo()">＋ 할 일 추가</button>
  </div>

  <!-- 필터 -->
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">전체</button>
    <button class="filter-btn" onclick="setFilter('active', this)">진행 중</button>
    <button class="filter-btn" onclick="setFilter('done', this)">완료</button>
  </div>

  <!-- 리스트 -->
  <div class="todo-list" id="todo-list"></div>

  <!-- 하단 -->
  <div class="footer">
    <button class="btn-clear" onclick="clearDone()">완료 항목 삭제</button>
  </div>

</div>

<script>
  let todos = [];
  let filter = 'all';
  let nextId = 1;

  // 오늘 날짜 표시
  const d = new Date();
  document.getElementById('today-date').textContent =
    `${d.getMonth()+1}월 ${d.getDate()}일`;

  // 엔터키로도 추가
  document.getElementById('todo-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
  });

  function addTodo() {
    const input = document.getElementById('todo-input');
    const text = input.value.trim();
    if (!text) { input.focus(); return; }

    console.log("추가됨!");  // ← 기존 버튼 요구사항 유지
    todos.unshift({ id: nextId++, text, done: false });
    input.value = '';
    input.focus();
    render();
  }

  function toggleDone(id) {
    const t = todos.find(t => t.id === id);
    if (t) t.done = !t.done;
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    render();
  }

  function clearDone() {
    todos = todos.filter(t => !t.done);
    render();
  }

  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function render() {
    const total = todos.length;
    const doneCount = todos.filter(t => t.done).length;
    const pct = total === 0 ? 0 : Math.round((doneCount / total) * 100);

    document.getElementById('prog-text').textContent = `${doneCount}개 완료`;
    document.getElementById('prog-pct').textContent = pct + '%';
    document.getElementById('prog-bar').style.width = pct + '%';

    const visible = todos.filter(t => {
      if (filter === 'active') return !t.done;
      if (filter === 'done')   return t.done;
      return true;
    });

    const list = document.getElementById('todo-list');

    if (visible.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <div class="empty-icon">${filter === 'done' ? '🎉' : '📝'}</div>
          <p>${filter === 'done' ? '완료한 항목이 없어요!' : '할 일을 추가해보세요!'}</p>
        </div>`;
      return;
    }

    list.innerHTML = visible.map(t => `
      <div class="todo-item ${t.done ? 'done' : ''}">
        <div class="chk" onclick="toggleDone(${t.id})">${t.done ? '✓' : ''}</div>
        <span class="todo-text">${t.text}</span>
        <button class="btn-del" onclick="deleteTodo(${t.id})" title="삭제">✕</button>
      </div>
    `).join('');
  }

  render();
</script>
</body>
</html>
