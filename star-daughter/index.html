<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>별빛 육성일기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: left = daughter's portrait + stat ledger, right = monthly planner (3 ten-day slots), modal for events.
   Single deliberate night-sky look: ink indigo ground, starlight gold accent, lavender secondary. */
:root {
  --ink: #12142a;
  --panel: #1c1f3d;
  --panel-2: #262a52;
  --line: #363b6e;
  --fg: #ece8f7;
  --muted: #a3a0c4;
  --gold: #e9c46a;
  --gold-soft: #e9c46a33;
  --lav: #a99be8;
  --good: #7fd6a6;
  --bad: #f08a8a;
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 9%, #fff6 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 38% 62%, #fff5 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 44%, #fff7 50%, transparent 51%),
    radial-gradient(1px 1px at 55% 86%, #fff5 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 22% 92%, #e9c46a88 50%, transparent 51%),
    radial-gradient(ellipse at 80% -10%, #2b2f66 0%, transparent 60%),
    var(--ink);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 16px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; justify-content: space-between; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
.brand svg { width: 26px; height: 26px; }
.date-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip b { color: var(--fg); font-weight: 400; }
.chip.gold b { color: var(--gold); }

.main { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .main > .profile { display: contents; }
  .main > .profile > .card:first-child { order: 0; grid-template-columns: minmax(0, 120px) minmax(0, 1fr); align-items: start; }
  .main > .profile > .card:first-child .portrait { grid-row: span 2; }
  .main > .profile > .card:first-child .who { flex-direction: column; gap: 0; }
  .main > .profile > .card:first-child .stats { grid-column: 1 / -1; }
  .planner { order: 1; }
  .main > .profile > .card:last-child { order: 2; }
}

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.card h2 { font-family: var(--font-display); font-size: 1.05rem; margin: 0 0 10px; font-weight: 700; color: var(--gold); letter-spacing: .03em; }

/* portrait */
.profile { display: grid; gap: 14px; }
.portrait { aspect-ratio: 200 / 240; max-width: 100%; border-radius: 12px; overflow: hidden;
  background: radial-gradient(circle at 50% 35%, #3a3f80 0%, #1a1d3c 75%); border: 1px solid var(--line); }
.portrait svg { width: 100%; height: 100%; display: block; }
.who { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.who .nm { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; }
.who .mood { font-size: .85rem; color: var(--muted); }

.stats { display: grid; gap: 6px; }
.stat { display: grid; grid-template-columns: 4.4em minmax(0, 1fr) 2.8em; align-items: center; gap: 8px; font-size: .88rem; }
.stat .k { color: var(--muted); }
.stat .v { text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 7px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--lav); border-radius: 4px; transition: width .5s ease; }
.stat.stress .bar i { background: var(--bad); }
.stat.flash .v { color: var(--gold); }

/* planner */
.planner { display: grid; gap: 14px; }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.slot { background: var(--panel-2); border: 1px dashed var(--line); border-radius: 12px; padding: 10px; min-height: 84px; text-align: left; display: grid; gap: 4px; align-content: start; }
.slot.filled { border-style: solid; border-color: var(--lav); }
.slot.next { border-color: var(--gold); }
.slot .when { font-size: .78rem; color: var(--muted); letter-spacing: .08em; }
.slot .what { font-family: var(--font-display); font-weight: 700; }
.slot .meta { font-size: .8rem; color: var(--muted); }
.slot .empty { color: var(--muted); font-size: .85rem; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: .9rem; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--gold); border-color: var(--gold); color: var(--ink); }

.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.act { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 10px; align-items: start; transition: border-color .15s, transform .15s; }
.act:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-1px); }
.act:disabled { opacity: .45; cursor: not-allowed; }
.badge { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; color: var(--ink); font-size: 1rem; grid-row: span 2; }
.act .nm { font-weight: 700; font-size: .95rem; }
.act .ds { font-size: .78rem; color: var(--muted); line-height: 1.4; }
.act .lv { color: var(--gold); font-size: .75rem; margin-left: 4px; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.actions .grp { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: .92rem; }
.btn:hover:not(:disabled) { border-color: var(--lav); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight: 700; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }

/* scene */
.scene { display: grid; gap: 12px; }
.scene-title { display: flex; align-items: center; gap: 12px; }
.scene-title .badge { grid-row: auto; width: 44px; height: 44px; font-size: 1.25rem; }
.scene-title .t { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; }
.scene-title .s { color: var(--muted); font-size: .85rem; }
.progress { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--lav), var(--gold)); }
.result { min-height: 3.2em; display: grid; gap: 6px; }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; }
.d { font-size: .8rem; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); font-variant-numeric: tabular-nums; }
.d.up { color: var(--good); } .d.down { color: var(--bad); } .d.g { color: var(--gold); }

/* log */
.log { display: grid; gap: 4px; max-height: 210px; overflow-y: auto; font-size: .84rem; color: var(--muted); }
.log p { margin: 0; }
.log p b { color: var(--fg); font-weight: 400; }

/* modal */
.modal { position: fixed; inset: 0; background: #07081599; display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal .box { background: var(--panel); border: 1px solid var(--gold); border-radius: 16px; padding: 20px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; display: grid; gap: 12px; }
.modal h3 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; color: var(--gold); text-wrap: balance; }
.modal .body { display: grid; gap: 8px; }
.modal .body p { margin: 0; }
.modal .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.shop-list { display: grid; gap: 8px; }
.shop-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
.shop-item .ds { font-size: .8rem; color: var(--muted); }
.rank { display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.rank div { display: flex; justify-content: space-between; gap: 10px; padding: 4px 8px; border-radius: 6px; }
.rank .me { background: var(--gold-soft); color: var(--gold); }

/* title & ending */
.title-screen { max-width: 640px; margin: 6vh auto 0; text-align: center; display: grid; gap: 18px; justify-items: center; }
.title-screen h1 { font-family: var(--font-display); font-size: clamp(2rem, 7vw, 3.2rem); margin: 0; letter-spacing: .04em; text-wrap: balance; }
.title-screen h1 span { color: var(--gold); }
.title-screen .lead { color: var(--muted); max-width: 34em; margin: 0; }
.title-screen .portrait { width: min(240px, 70vw); }
.name-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.name-row input { background: var(--panel-2); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; padding: 9px 12px; font: inherit; width: 12em; }
.how { text-align: left; font-size: .88rem; color: var(--muted); }
.how ul { margin: 6px 0 0; padding-left: 1.2em; display: grid; gap: 3px; }
.ending-title { font-family: var(--font-display); font-size: clamp(1.6rem, 5vw, 2.4rem); color: var(--gold); margin: 0; text-wrap: balance; }
.final-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; width: 100%; }
.final-stats div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: flex; justify-content: space-between; font-size: .88rem; font-variant-numeric: tabular-nums; }

.speed { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app" class="wrap"></div>

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function josa(word, a, b) { // 받침 여부로 조사 선택
  const c = word.charCodeAt(word.length - 1);
  if (c < 0xac00 || c > 0xd7a3) return word + b;
  return word + (((c - 0xac00) % 28) ? a : b);
}

    stats: { hp: 30, str: 18, int: 22, ele: 15, cha: 22, sen: 25, mor: 30, com: 5, mag: 8, house: 10 },
    stress: 0, lessonCnt: {}, owned: {}, outfit: 'default', talked: false,
    lastPlan: null, wins: {}, log: [], festivalDone: false,

}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

function log(html) { S.log.unshift(`<b>${S.year}년 ${S.month}월</b> ${html}`); S.log = S.log.slice(0, 60); }

function apply(delta) {
  for (const [k, v] of Object.entries(delta)) {
    if (!v) continue;
    if (k === 'gold') S.gold = Math.max(0, S.gold + v);
    else if (k === 'stress') S.stress = clamp(S.stress + v, 0, 100);
    else S.stats[k] = clamp(S.stats[k] + v, 0, 999);
  }
}
function addTo(d, k, v) { d[k] = (d[k] || 0) + v; }
function lessonLv(id) { return Math.min(5, Math.floor((S.lessonCnt[id] || 0) / 8)); }

/* ============ 모달 ============ */
function showModal(title, html, buttons) {
  return new Promise(resolve => {
    const m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${title}</h3><div class="body">${html}</div><div class="btns"></div></div>`;
    const btns = m.querySelector('.btns');
    (buttons || [{ label: '확인', primary: true }]).forEach(b => {
      const el = document.createElement('button');
      el.className = 'btn' + (b.primary ? ' primary' : '');
      el.textContent = b.label;
      if (b.disabled) el.disabled = true;
      el.onclick = () => { m.remove(); if (b.fn) b.fn(); resolve(b.value); };
      btns.appendChild(el);
    });
    document.body.appendChild(m);
    const first = btns.querySelector('.primary') || btns.querySelector('button');
    if (first) first.focus();
    m._resolve = resolve;
  });
}
function deltaChips(d) {
  return `<div class="deltas">${Object.entries(d).filter(([, v]) => v).map(([k, v]) => {
    const good = k === 'stress' ? v < 0 : v > 0;
    return `<span class="d ${k === 'gold' ? 'g' : good ? 'up' : 'down'}">${SN[k]} ${v > 0 ? '+' : ''}${v}${k === 'gold' ? 'G' : ''}</span>`;
  }).join('')}</div>`;
}

function talk(kind) {
  let d, t;
  if (kind === 'praise') { d = { stress: -8, cha: 1 }; t = `"정말? 헤헤…" ${esc(josa(S.name, '이', '가'))} 귀까지 빨개졌다.`; }
  else if (kind === 'scold') { d = { mor: 5, stress: 8 }; t = `"…알았어요." 입술을 삐죽였지만 고개를 끄덕였다.`; }
  else { d = { gold: -30, stress: -12, mor: -1 }; t = `"고마워요, 아빠!" 시장으로 뛰어나갔다.`; }
  apply(d); S.talked = true; log(t); save(); refreshSide(d); renderPlanner();
  showModal('대화', `<p>${t}</p>${deltaChips(d)}`);
}

function openShop() {
  const list = SHOP.map(it => {
    const owned = S.owned[it.id];
    let btn;
    if (it.outfit && owned) btn = S.outfit === it.outfit ? `<button class="btn" disabled>입는 중</button>` : `<button class="btn" data-wear="${it.outfit}">입히기</button>`;
    else if (owned && !it.eat) btn = `<button class="btn" disabled>보유</button>`;
    else btn = `<button class="btn primary" data-buy="${it.id}" ${S.gold < it.price ? 'disabled' : ''}>${it.price}G</button>`;
    return `<div class="shop-item"><div><b>${it.name}</b><div class="ds">${it.desc}</div></div>${btn}</div>`;
  }).join('');
  const wearDefault = S.outfit !== 'default' ? `<div class="shop-item"><div><b>하늘색 원피스</b><div class="ds">처음 입고 온 옷</div></div><button class="btn" data-wear="default">입히기</button></div>` : '';
  showModal('시장 거리 상점', `<p class="speed">소지금 ${S.gold.toLocaleString()}G</p><div class="shop-list">${list}${wearDefault}</div>`, [{ label: '나가기' }]);
  const box = document.querySelector('.modal:last-child');
  box.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
    const it = SHOP.find(x => x.id === b.dataset.buy);
    if (S.gold < it.price) return;
    S.gold -= it.price; apply(it.eff);
    if (!it.eat) S.owned[it.id] = true;
    if (it.outfit) S.outfit = it.outfit;
    log(`상점에서 <b>${it.name}</b>${it.eat ? '을 사 먹었다.' : '을 샀다.'}`);
    save(); refreshSide(it.eff); box.remove(); openShop();
  });
  box.querySelectorAll('[data-wear]').forEach(b => b.onclick = () => {
    S.outfit = b.dataset.wear; save(); refreshSide({}); box.remove(); openShop();
  });
}

/* ============ 한 달 진행 ============ */
function runLesson(a) {
  const lines = [], d = {};
  if (S.gold < a.cost) { lines.push(`수업료 ${a.cost}G가 없어 ${a.name}에 가지 못하고 집에 있었다.`); d.stress = -4; return { lines, d }; }
  d.gold = -a.cost;
  const lv = lessonLv(a.id), mult = 1 + lv * 0.2;
  const ok = Math.random() < clamp(0.93 - S.stress / 230, 0.3, 0.95);
  const f = ok ? mult : mult * 0.35;
  for (const [k, [lo, hi]] of Object.entries(a.gain)) addTo(d, k, Math.max(ok && hi ? 1 : 0, Math.round(rnd(lo, hi) * f)));
  for (const [k, [lo, hi]] of Object.entries(a.loss)) addTo(d, k, -rnd(lo, hi));
  addTo(d, 'stress', a.stress);
  S.lessonCnt[a.id] = (S.lessonCnt[a.id] || 0) + 1;
  lines.push(ok ? pick(a.ok) : pick(['수업 내내 꾸벅꾸벅 졸았다.', '딴생각을 하다 선생님께 혼났다.', '오늘은 영 집중이 안 됐다.']));
  if (lessonLv(a.id) > lv) lines.push(`<b>${a.name} 레벨이 ${lessonLv(a.id)}로 올랐다!</b> 앞으로 더 많이 배운다.`);
  return { lines, d };
}
function runJob(a) {
  const lines = [], d = {};
  const stat = S.stats[a.check];
  const ok = Math.random() < clamp(0.42 + stat / 260 - S.stress / 230, 0.15, 0.95);
  const pay = Math.round(jobPay(a) * (ok ? 1 : 0.4));
  d.gold = pay;
  const f = ok ? 1 : 0.5;
  for (const [k, [lo, hi]] of Object.entries(a.gain)) addTo(d, k, Math.round(rnd(lo, hi) * f));
  for (const [k, [lo, hi]] of Object.entries(a.loss)) addTo(d, k, -rnd(lo, hi));
  addTo(d, 'stress', a.stress);
  lines.push(ok ? pick(['주인이 "다음에도 와 달라"며 웃었다.', '일을 척척 해내 품삯을 다 받았다.', '손님들에게 칭찬을 들었다.'])
                : pick(['실수를 연발해 품삯이 깎였다.', '접시를 깨뜨려 혼이 났다.', '힘에 부쳐 일을 다 끝내지 못했다.']));
  return { lines, d };
}
function runRest(a) {
  const lines = [], d = {};
  if (a.id === 'rest') { d.stress = -rnd(16, 22); d.hp = rnd(1, 3); lines.push(pick(['늦잠을 자고 햇볕 아래서 뒹굴었다.', '고양이와 하루 종일 낮잠을 잤다.'])); }
  else if (a.id === 'trip') {
    if (S.gold < 120) { d.stress = -10; lines.push('여행 경비가 모자라 동네 언덕에 소풍을 다녀왔다.'); return { lines, d }; }
    d.gold = -120; d.stress = -rnd(35, 45); d.sen = rnd(3, 6); d.hp = rnd(2, 4);
    lines.push(pick(['처음 본 바다에 한참을 서 있었다.', '조개껍데기를 한 주머니 주워 왔다.']));
  } else {
    d.stress = -rnd(8, 12);
    if (Math.random() < 0.6) { const ev = pick(RANDOM_EVENTS); lines.push(ev.t); for (const [k, v] of Object.entries(ev.eff)) addTo(d, k, v); }
    else lines.push(pick(['광장을 어슬렁거리며 군것질을 했다.', '들판에서 꽃반지를 만들었다.']));
  }
  return { lines, d };
}
function runAdv(a) {
  const lines = [], d = { stress: 4 };
  const s = S.stats;
  const power = s.com + s.str * 0.4 + s.mag * 0.6 + s.hp * 0.2;
  const tierBase = a.id === 'ruin' ? 2 : 0;
  const tierMax = Math.min(MONSTERS.length - 1, tierBase + Math.floor((S.age - 10) / 2));
  const fights = a.id === 'ruin' ? 3 : 2;
  for (let i = 0; i < fights; i++) {
    const m = MONSTERS[rnd(tierBase, tierMax)];
    const p = clamp(power / (power + m.pow) * 1.25, 0.08, 0.95);
    if (Math.random() < p) {
      const g = rnd(15, 40) * (MONSTERS.indexOf(m) + 1);
      addTo(d, 'gold', g); addTo(d, 'com', rnd(1, 3)); addTo(d, 'mag', rnd(0, 2));
      lines.push(`<b>${m.name}</b>${josa(m.name, '을', '를').slice(m.name.length)} 물리쳤다! (${g}G)`);
    } else {
      addTo(d, 'hp', -rnd(2, 5)); addTo(d, 'stress', rnd(6, 10));
      lines.push(`<b>${m.name}</b>에게 쫓겨 도망쳤다…`);
      break;
    }
  }
  if (Math.random() < (a.id === 'ruin' ? 0.3 : 0.15)) { const g = a.id === 'ruin' ? 300 : 100; addTo(d, 'gold', g); addTo(d, 'sen', 3); lines.push(`덤불 속에서 반짝이는 별의 조각을 주웠다. (${g}G)`); }
  return { lines, d };
}

async function runSlot(i, id) {
  const a = ACT[id];
  const p = $('#planner');
  const dur = ui.fast ? 250 : 1100;
  p.innerHTML = `
    <div class="scene">
      <span class="when speed">${S.month}월 ${SLOT_NAMES[i]}</span>
      <div class="scene-title"><span class="badge" style="background:${HUE[a.cat]}">${a.badge}</span>
        <div><div class="t">${a.name}</div><div class="s">${esc(S.name)} · ${S.age}살</div></div></div>
      <div class="progress"><i id="prog"></i></div>
      <div class="result" id="result"><span class="speed">열흘이 지나가는 중…</span></div>
    </div>`;
  const prog = $('#prog');
  prog.animate([{ width: '0%' }, { width: '100%' }], { duration: dur, fill: 'forwards', easing: 'ease-in-out' });
  await sleep(dur);

  let res;
  if (S.stress >= 100) {
    res = { lines: [`${esc(josa(S.name, '이', '가'))} 열이 펄펄 끓어 앓아누웠다. 의원을 불렀다. (40G)`], d: { stress: -35, gold: -40, hp: -2 }, sick: true };
  } else if ((a.cat === 'lesson' || a.cat === 'job') && S.stress >= 80 && Math.random() < 0.4) {
    res = { lines: [`${a.name}에 간다더니… 몰래 빠져나가 하루 종일 놀다 왔다.`], d: { stress: -10, mor: -2 } };
  } else {
    res = a.cat === 'lesson' ? runLesson(a) : a.cat === 'job' ? runJob(a) : a.cat === 'rest' ? runRest(a) : runAdv(a);
  }
  apply(res.d);
  log(`${SLOT_NAMES[i]} ${a.name}: ${res.lines[0]}`);
  refreshSide(res.d);
  $('#result').innerHTML = res.lines.map(l => `<p style="margin:0">${l}</p>`).join('') + deltaChips(res.d);
  await sleep(ui.fast ? 450 : 1500);
  return res;
}

async function runMonth() {
  if (ui.running || ui.plan.includes(null)) return;
  ui.running = true;
  const plan = ui.plan.slice();
  S.lastPlan = plan.slice();
  for (let i = 0; i < 3; i++) {
    const r = await runSlot(i, plan[i]);
    if (r.sick) { for (let j = i + 1; j < 3; j++) log(`${SLOT_NAMES[j]} 몸져누워 쉬었다.`); S.stress = clamp(S.stress - 15 * (2 - i), 0, 100); break; }
  }
  await endOfMonth();
  ui.running = false;
}

async function endOfMonth() {
  apply({ gold: PENSION });
  // 랜덤 이벤트
  if (Math.random() < 0.22) {
    const ev = pick(RANDOM_EVENTS); apply(ev.eff); log(ev.t); refreshSide(ev.eff);
    await showModal('이달의 일', `<p>${ev.t}</p>${deltaChips(ev.eff)}`);
  }
  if (S.month === 10) await festival();

  // 다음 달
  S.month++; S.elapsed++; S.talked = false;
  if (S.month > 12) { S.month = 1; S.year++; }
  ui.plan = [null, null, null];

  if (S.month === 4) {
    S.age++;
    if (S.elapsed >= TOTAL_MONTHS) { save(); ui.screen = 'ending'; render(); return; }
    log(`${S.age}번째 생일. 작은 케이크에 초를 꽂았다.`);
    save(); render();
    await showModal(`${S.age}살 생일`, `<p>${esc(josa(S.name, '이', '가'))} ${S.age}살이 되었습니다.</p>
      <p>${birthdayLine(S.age)}</p>${S.age === 12 ? '<p class="speed">이제 별똥별 숲 탐험과 사냥꾼 조수 일을 할 수 있습니다.</p>' :
        S.age === 13 ? '<p class="speed">주점 서빙, 석공 보조 일을 할 수 있습니다.</p>' : S.age === 14 ? '<p class="speed">귀족 저택 시녀 일을 할 수 있습니다.</p>' :
        S.age === 15 ? '<p class="speed">무너진 별탑을 탐사할 수 있습니다.</p>' : ''}`, [{ label: '축하해!', primary: true }]);
    return;
  }
  save(); render();
}
function birthdayLine(age) {
  const top = topStat();
  return {
    11: '"아빠, 나 키 컸죠?" 문틀에 눈금을 새겨 달라고 조릅니다.',
    12: '요즘 부쩍 혼자 생각에 잠기는 일이 늘었습니다.',
    13: `동네 사람들이 "${SN[top]}이(가) 남다른 아이"라고 수군댑니다.`,
    14: '거울 앞에 서 있는 시간이 길어졌습니다.',
    15: '이제 제법 어른스러운 말투를 씁니다.',
    16: '"나중에 뭐가 될지, 조금은 알 것 같아요."',
    17: '마지막 한 해. 그녀가 걸어갈 길이 거의 보입니다.',
  }[age] || '';
}
function topStat() {
  return STATS.map(([k]) => k).sort((a, b) => S.stats[b] - S.stats[a])[0];
}

async function festival() {
  const opts = Object.entries(CONTESTS).map(([k, c]) => ({ label: c.name, value: k, primary: false }));
  opts.push({ label: '구경만 한다', value: null });
  const choice = await showModal('추수제가 열렸다!', `<p>광장에 등불이 걸리고 사방에서 음악이 흘러나옵니다. 올해는 어느 대회에 나가볼까요?</p>
    <p class="speed">무술: 전투·근력 / 미의 경연: 매력·기품 / 요리: 가사·감성 / 예술제: 감성·지능</p>`, opts);
  if (!choice) { apply({ stress: -10 }); log('추수제를 구경하며 실컷 놀았다.'); refreshSide({ stress: -10 }); return; }
  const c = CONTESTS[choice];
  const mine = Math.round(c.stat(S.stats) * (0.85 + Math.random() * 0.3));
  const base = 45 + (S.age - 10) * 48;
  const rivals = RIVALS.slice().sort(() => Math.random() - 0.5).slice(0, 4)
    .map(n => ({ n, s: Math.round(base * (0.6 + Math.random() * 0.75)) }));
  const all = [...rivals, { n: S.name, s: mine, me: true }].sort((a, b) => b.s - a.s);
  const rank = all.findIndex(x => x.me) + 1;
  let d = {}, msg;
  if (rank === 1) { d = { gold: 300, ...c.bonus, stress: -5 }; S.wins[choice] = (S.wins[choice] || 0) + 1; msg = `<b>우승!</b> ${c.praise}`; }
  else if (rank === 2) { d = { gold: 100, stress: 2 }; msg = '아쉬운 준우승. 그래도 상금을 받았다.'; }
  else { d = { stress: 6 }; msg = `${rank}위. 분해서 밤새 베개를 적셨다.`; }
  apply(d); log(`${c.name} ${rank}위.`); refreshSide(d);
  await showModal(c.name + ' 결과', `<div class="rank">${all.map((x, i) => `<div class="${x.me ? 'me' : ''}"><span>${i + 1}위 ${esc(x.n)}</span><span>${x.s}점</span></div>`).join('')}</div>
    <p>${msg}</p>${deltaChips(d)}`);
}

/* ============ 엔딩 ============ */
function decideEnding() {
  const s = S.stats, w = S.wins, n = esc(S.name);
  const totalWins = Object.values(w).reduce((a, b) => a + b, 0);
  const E = [
    { ok: s.ele >= 380 && s.int >= 300 && s.cha >= 320 && s.mor >= 250, t: '별의 왕비', d: `무도회에서 ${josa(n, '을', '를')} 본 왕세자가 청혼했다. 사람들은 하늘에서 내려온 왕비라 부르며, ${n}의 다스림 아래 왕국은 오래도록 평화로웠다.` },
    { ok: s.com >= 420 && s.str >= 280, t: '왕국 기사단장', d: `아버지의 낡은 검을 이어받은 ${josa(n, '은', '는')} 최연소 기사단장이 되었다. 국경의 마물들은 별 모양 문장을 보기만 해도 달아났다.` },
    { ok: s.mag >= 420 && s.int >= 300, t: '궁정 대마법사', d: `${josa(n, '은', '는')} 별의 언어를 읽는 단 한 사람이 되었다. 밤마다 탑 꼭대기에서 고향 별과 이야기를 나눈다고 한다.` },
    { ok: s.mor >= 420 && s.mag >= 180, t: '신전의 성녀', d: `아픈 이들의 손을 잡아주던 ${josa(n, '은', '는')} 성녀로 추대되었다. 그녀가 지나간 길에는 늘 작은 빛이 남았다.` },
    { ok: s.int >= 430, t: '왕립 학술원 학자', d: `${josa(n, '은', '는')} 유성의 궤도를 계산한 논문으로 학계를 뒤흔들었다. 언젠가 자신이 온 별을 찾아내겠다고 한다.` },
    { ok: s.sen >= 420, t: '이름난 화가', d: `${n}의 밤하늘 그림은 왕궁 회랑에 걸렸다. 그림 속 별들은 보는 사람마다 다른 이야기를 속삭인다.` },
    { ok: s.cha >= 420, t: '무대 위의 별', d: `${josa(n, '은', '는')} 수도 대극장의 주연 무희가 되었다. 공연이 있는 밤이면 표를 구하려는 줄이 광장을 한 바퀴 돌았다.` },
    { ok: s.house >= 420, t: '왕궁 요리장', d: `${n}의 수프 한 그릇에 왕도 웃음을 터뜨렸다. 왕궁 주방은 이제 그녀의 작은 왕국이다.` },
    { ok: S.gold >= 6000, t: '시장 거리의 거상', d: `차곡차곡 모은 돈으로 가게를 연 ${josa(n, '은', '는')} 몇 년 만에 왕국 제일의 상단을 이끌게 되었다.` },
    { ok: s.com >= 260 && s.hp >= 220, t: '떠돌이 모험가', d: `${josa(n, '은', '는')} 배낭 하나를 메고 길을 떠났다. 가끔 먼 나라의 이상한 기념품이 담긴 편지가 도착한다.` },
    { ok: s.mor <= 40 && S.stress >= 55, t: '뒷골목의 두목', d: `언제부턴가 ${josa(n, '은', '는')} 밤늦게 들어오지 않았다. 이제 항구 뒷골목에서 그녀의 이름을 모르는 사람은 없다.` },
    { ok: totalWins >= 4, t: '추수제의 전설', d: `추수제 우승만 ${totalWins}번. ${josa(n, '은', '는')} 축제의 상징이 되어 매년 개막식에서 첫 등불을 밝힌다.` },
  ];
  const hit = E.find(e => e.ok);
  if (hit) return hit;
  const top = topStat();
  return { t: '마을의 평범한 아가씨', d: `${josa(n, '은', '는')} 특별한 무언가가 되지는 않았지만, 마을 사람 누구에게나 사랑받는 아가씨로 자랐다. 특히 ${SN[top]}만큼은 누구에게도 지지 않는다. 무엇보다, 매일 저녁 당신과 같은 식탁에 앉는다.` };
}
function renderEnding(app) {
  const e = decideEnding();
  const wins = Object.entries(S.wins).map(([k, v]) => `${CONTESTS[k].name} 우승 ${v}회`).join(', ');
  app.innerHTML = `
  <div class="title-screen">
    <span class="speed">왕국력 ${S.year}년 봄 · ${esc(S.name)} 18살</span>
    <div class="portrait">${portrait(S)}</div>
    <h1 class="ending-title">${e.t}</h1>
    <p class="lead">${e.d}</p>
    <div class="final-stats">${STATS.map(([k, n]) => `<div><span>${n}</span><b>${S.stats[k]}</b></div>`).join('')}
      <div><span>소지금</span><b>${S.gold}</b></div></div>
    ${wins ? `<p class="speed">${wins}</p>` : ''}
    <button class="btn primary" id="againBtn">새로운 아이와 다시 시작</button>
  </div>`;
  $('#againBtn').onclick = () => { clearSave(); S = null; ui.screen = 'title'; render(); };
}

/* ============ 부팅 ============ */
function start(data) {
  if (data && data.S) { S = data.S; ui.screen = data.screen === 'ending' ? 'ending' : (data.S ? 'game' : 'title'); }
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S, screen: ui.screen }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
